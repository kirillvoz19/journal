# Пинг Supabase раз в 5 дней, чтобы бесплатный проект не уходил в паузу.
#
# В GitHub: Settings → Secrets and variables → Actions → New repository secret
# Добавь два секрета:
#   SUPABASE_ANON_KEY  = значение VITE_SUPABASE_ANON_KEY из .env
#   SUPABASE_PROJECT_REF = поддомен из VITE_SUPABASE_URL (например из https://abc.supabase.co → abc)

name: Ping Supabase (keep awake)

on:
  schedule:
    - cron: '0 12 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/rest/v1/")
          echo "Response code: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -le 399 ]; then
            echo "Supabase is awake"
          else
            echo "Unexpected response: $RESPONSE"
            exit 1
          fi
